<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>xNxP Tabs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="icons/icon128.png" alt="" class="brand-icon">
        <span class="brand-text">xNxP Tabs</span>
      </div>
      <input
        id="search-input"
        type="search"
        placeholder="Search tabs..."
        autocomplete="off"
      />
      <div class="tab-count">
        <div class="current">
          <span class="count" id="visible-tab-count">0</span>
          <span class="label">tabs</span>
        </div>
        <div class="personal-best" id="personal-best" style="display: none;">
          <span class="label">Best:</span>
          <span class="number" id="personal-best-number">0</span>
          <span class="fire">🔥</span>
        </div>
      </div>
      <label class="audio-filter" title="Show only tabs playing audio">
        <input type="checkbox" id="audio-filter-checkbox">
        <span>Playing audio</span>
      </label>
    </div>

    <div id="debug-panel" class="debug-panel" hidden>
      <label class="debug-toggle" title="Log extension internals for troubleshooting">
        <input type="checkbox" id="debug-mode-checkbox" />
        <span>Debug</span>
      </label>
      <button type="button" id="debug-copy-btn" class="debug-copy-btn">Copy logs</button>
      <button type="button" id="debug-hide-btn" class="debug-copy-btn" title="Hide this panel">Hide</button>
      <span id="debug-status" class="debug-status"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th class="col-actions">Actions</th>
          <th class="col-date" data-sort="lastOpened">Last<br />Opened <span class="sort-indicator"></span></th>
          <th class="col-date" data-sort="firstOpened">First<br />Opened <span class="sort-indicator"></span></th>
          <th class="col-tab" data-sort="title">Tab / URL <span class="sort-indicator"></span></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <div id="empty-state" class="empty-state" hidden></div>

    <button
      type="button"
      id="kofi-link"
      class="kofi-link"
      title="Support on Ko-fi"
      aria-label="Support on Ko-fi"
    ><span class="kofi-icon" aria-hidden="true">☕</span><span class="kofi-label">ko-fi</span></button>

    <script src="browser-polyfill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
