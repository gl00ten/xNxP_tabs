<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>xNxP Tabs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>xNxP Tabs</h1>

    <div class="toolbar">
      <input
        id="search-input"
        type="search"
        placeholder="Search tabs..."
        autocomplete="off"
      />

      <label class="audio-filter" title="Show only tabs playing audio">
        <input type="checkbox" id="audio-filter-checkbox">
        <span>Playing audio</span>
      </label>
    </div>

    <table>
      <thead>
        <tr>
          <th>Actions</th>
          <th data-sort="firstOpened">First<br />Opened <span class="sort-indicator"></span></th>
          <th data-sort="lastOpened">Last<br />Opened <span class="sort-indicator"></span></th>
          <th data-sort="title">Tab / URL <span class="sort-indicator"></span></th>
          <th data-sort="id">ID <span class="sort-indicator"></span></th>
          <th data-sort="windowId">Win <span class="sort-indicator"></span></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <script src="browser-polyfill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
